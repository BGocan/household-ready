name: Archive official guidance
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-guidance-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check allowlisted official sources
        run: python3 scripts/archive_updates.py
      - name: Commit archive if changed
        run: |
          git config user.name 'Household Ready archive'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/updates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Archive latest official guidance'
            git push
          fi
